[project]
name = "lineageauth"
version = "0.1.0"
description = "LineageAuth (LAP) — portable, cryptographically verifiable authority and evidence layer for autonomous agents."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "miyawakiclaude" }]
keywords = ["did", "ed25519", "authority", "delegation", "agents", "provenance"]

dependencies = [
    "pydantic>=2.9",
    "cryptography>=43",
    "rfc8785>=0.1.4",
    "base58>=2.1",
    "typer>=0.12",
]

[project.optional-dependencies]
# The REST API is optional on purpose. CLAUDE.md 2.7.2 requires the protocol
# core to stay fully useful locally, so nothing here may be needed to verify an
# event, resolve a lineage, or check a permission.
api = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]
# Also optional. The tool layer in `adapters/mcp/tools.py` is deliberately
# SDK-independent, so the protocol work does not move when the SDK does.
mcp = [
    "mcp>=1.0",
]
dev = [
    "pytest>=8",
    # Test-only. The schemas in schemas/ are checked against real events with a
    # real validator rather than a hand-rolled one -- the same rule that keeps
    # JCS delegated to a library.
    "jsonschema>=4.23",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "fastapi>=0.115",
    "httpx>=0.27",
]

[project.scripts]
la = "lineageauth.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages/py/lineageauth"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages/py", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "RUF"]
ignore = ["S101"]  # assert is expected in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "packages/py"
packages = ["lineageauth"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "packages/py"]
addopts = "-q --strict-markers"
markers = [
    "network: test requires network access (NOT run by default; CLAUDE.md 2.3)",
]
