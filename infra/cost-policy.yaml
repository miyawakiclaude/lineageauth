# LineageAuth budget invariant — CLAUDE.md 2.7 / docs/31_ZERO_COST_OPERATIONS.md
#
# This file is the machine-readable spend contract. Do not relax any of the
# flags below without explicit human approval recorded in docs/29_DECISIONS.md.
budget_mode: zero_cost
monthly_spend_limit_jpy: 0
allow_paid_services: false
allow_automatic_upgrades: false
allow_domain_purchase: false
on_free_limit_exceeded: stop_or_degrade

# Every external service must appear here before it is used, with the date its
# current free tier was actually checked. Old quota numbers are not permanent
# architecture assumptions (docs/SOURCE_NOTES.md).
services:
  - name: local-filesystem-event-store
    purpose: immutable signed event store
    required: true
    cost_mode: free
    billing_enabled: false
    free_tier_checked: n/a
    fallback: n/a
    shutdown_behavior: n/a

  - name: local-sqlite
    purpose: derived index, rebuildable from events
    required: true
    cost_mode: free
    billing_enabled: false
    free_tier_checked: n/a
    fallback: n/a
    shutdown_behavior: n/a

  - name: github-repository
    purpose: source hosting
    required: false
    cost_mode: free
    billing_enabled: false
    free_tier_checked: "2026-08-26"
    fallback: local git repository
    shutdown_behavior: development continues locally
    notes: >
      Free for public repositories. No remote is configured yet; adding one is
      an external write and needs explicit approval (CLAUDE.md 2.3, 2.8.11).

  - name: github-actions
    purpose: CI (lint, types, tests, secret scan)
    required: false
    cost_mode: free
    billing_enabled: false
    free_tier_checked: "2026-08-26"
    fallback: run the same commands locally via `uv run`
    shutdown_behavior: disable the workflow; local checks are authoritative
    notes: >
      Standard GitHub-hosted runners are free and UNMETERED on public
      repositories, verified 2026-08-26. On a PRIVATE repository the same
      workflow draws on the Free plan's 2,000 minutes/month instead and can
      eventually incur charges. Making this repository private is therefore a
      budget decision, not just a visibility one.

  - name: github-pages
    purpose: publishing the static Explorer, conformance vectors and schemas
    required: false
    cost_mode: free
    billing_enabled: false
    free_tier_checked: "2026-08-27"
    fallback: the site is a build artifact; `scripts/build_site.py` reproduces it
    shutdown_behavior: >
      Turn the source off in repository settings. Nothing depends on the site
      being reachable -- everything it serves is in the repository, and the
      protocol's own rule is that a public URL is not required to prove
      correctness (docs/31).
    notes: >
      Free on PUBLIC repositories, verified 2026-08-27: 1 GB published site,
      100 GB/month bandwidth (soft), 10 builds/hour (soft). Making this
      repository private would end that, so visibility is a budget decision
      here as well as for Actions.

      Registered the same day the site went live rather than before it, which
      is the wrong order -- the rule says free tiers are verified BEFORE
      deployment (D-078).

# Not selected. Listed so that "we already decided this" is never assumed.
# Each would need a free-tier verification date and human approval first.
#
# Free tiers checked 2026-08-27. Numbers here are a snapshot, not architecture:
# re-check before selecting anything (docs/SOURCE_NOTES.md).
#
# NOTHING BELOW IS NEEDED YET. The trigger is a single question -- does somebody
# other than the author need to fetch a verification without cloning the repo?
# Until then the local API and the event store answer everything, at zero yen.
# And when that day comes, step 1 of the deployment decision tree in
# docs/31 still applies first: a passport or an event bundle is a static JSON
# file, and static files are already free on the GitHub repository that exists.
# The genuine trigger for compute is narrower than "we want to deploy": it is a
# public *dynamic* read endpoint -- somebody POSTing an arbitrary bundle to
# /v1/verify/event and getting a verdict back.
candidates_not_selected:
  - cloudflare-pages       # Explorer hosting. 500 builds/month; static requests
                           # unmetered. Pages Functions are Workers and share the
                           # Workers cap below.
  - cloudflare-workers     # small read API. MEASURED 2026-08-27 and RULED OUT
                           # for a verify endpoint, on two independent grounds:
                           #   1. CPU. The free plan gives 10 ms per request.
                           #      Admitting a 51-event bundle costs 25.6 ms on
                           #      native CPython; a whole request costs 43.7 ms.
                           #      Admission is linear in events and the caller
                           #      picks the count, so the endpoint pays whatever
                           #      it is asked to. See scripts/benchmark.py.
                           #   2. Runtime. Python Workers run under Pyodide
                           #      (WebAssembly) and `cryptography` is a native
                           #      package that cannot be imported there, so the
                           #      verifier will not run at all.
                           # The zero-cost answer is precomputed static files.
  - cloudflare-d1          # shared derived index. 5 GB and 5M reads/writes per
                           # month. Only needed if the index must be shared; it
                           # is rebuildable from events by design, so a local
                           # SQLite plus an export is the cheaper default.
  - cloudflare-r2          # optional immutable mirror, only if hash-only receipts prove insufficient
#
# The paid plan starts at $5/month, which is a budget decision requiring
# explicit approval recorded in docs/29_DECISIONS.md -- not a fallback to slip
# into when a free limit is hit. on_free_limit_exceeded above says stop or
# degrade, and it means it.

# Documentation-only. Never provision without explicit approval (CLAUDE.md 2.7.5).
paid_scale_targets:
  - postgresql
  - redis
  - managed-object-storage
  - managed-search
  - paid-observability
  - custom-domain
